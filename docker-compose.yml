name: sensory-groove-v2

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-sensorygroove}
      # Protege /api/admin/*. Cambialo antes de exponer la API a internet.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-sensory-admin-dev}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: "8"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Comprobantes y QRs generados persisten fuera del contenedor.
      - uploads:/app/uploads
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-sensorygroove}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-sensorygroove}"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
