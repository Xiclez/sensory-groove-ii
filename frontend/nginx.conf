server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los comprobantes pueden ser fotos de pantalla completa.
    client_max_body_size 12M;

    # La API vive en el contenedor backend; el navegador solo ve /api.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: /admin y cualquier otra ruta de React deben resolver a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
